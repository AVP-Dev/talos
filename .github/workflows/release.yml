name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach assets to (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: talos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: talos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Binary
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG_NAME="talos-${TAG}-${{ matrix.target }}"
          STAGE_DIR="/tmp/${PKG_NAME}"
          mkdir -p "${STAGE_DIR}"
          cp "target/${{ matrix.target }}/release/talos" "${STAGE_DIR}/talos"
          cp LICENSE README.md "${STAGE_DIR}/"
          tar -czf "${PKG_NAME}.tar.gz" -C "/tmp" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG_NAME="talos-${TAG}-${{ matrix.target }}"
          gh release upload "${TAG}" "${PKG_NAME}.tar.gz" "${PKG_NAME}.tar.gz.sha256" --clobber
