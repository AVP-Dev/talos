name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Configure Git Identity for Tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-targets --locked

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux

      - name: Native workspace topology and reuse
        run: cargo test --locked --lib tmux::tests::creates_only_one_control_session_for_a_project -- --ignored --nocapture

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Capture actual native workspace (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xterm xdotool imagemagick fonts-dejavu-core
          npm install --prefix "$RUNNER_TEMP/talos-screenshot-tools" @openai/codex @anthropic-ai/claude-code
          PATH="$RUNNER_TEMP/talos-screenshot-tools/node_modules/.bin:$PATH" xvfb-run -a -s '-screen 0 1600x1000x24' bash scripts/capture-native-workspace.sh target/release/talos captures

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: native-workspace-screenshots
          path: captures/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Package experimental preview
        run: |
          archive="talos-preview-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "$archive" -C target/release talos
          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: talos-preview-${{ runner.os }}-${{ runner.arch }}
          path: talos-preview-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
